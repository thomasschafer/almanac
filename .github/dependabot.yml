version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 5
    ignore:
      # TypeScript 7 (the Go-native rewrite) drops the JS compiler API that
      # typescript-eslint is built on, and typescript-eslint's peer range is
      # ">=4.8.4 <6.1.0", so `npm ci` fails. Remove this once a typescript-eslint
      # release supports TypeScript 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 5
